name: USB Audio Player (Android)

on:
  push:
    paths:
      - "usb-audio-player/**"
      - ".github/workflows/usb-audio-player.yml"
  pull_request:
    paths:
      - "usb-audio-player/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: usb-audio-player
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests (DSP)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: APKs bauen
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: hires-usb-player-apk
          path: |
            usb-audio-player/app/build/outputs/apk/release/*.apk
            usb-audio-player/app/build/outputs/apk/debug/*.apk

      - name: Lint
        run: ./gradlew --no-daemon lintDebug
